# Painel de artigos (Decap CMS). Antes de usar, troque a linha "repo" pelo seu repositório do GitHub.
backend:
  name: github
  repo: brenoproensso-cpu/brenoproencoadv
  branch: main
  commit_messages:
    create: 'Novo artigo: {{slug}}'
    update: 'Atualiza artigo: {{slug}}'
    delete: 'Remove artigo: {{slug}}'
    uploadMedia: 'Envia imagem: {{path}}'
    deleteMedia: 'Remove imagem: {{path}}'

locale: pt
publish_mode: simple
media_folder: assets/uploads
public_folder: /assets/uploads
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

collections:
  - name: artigos
    label: Artigos
    label_singular: Artigo
    description: 'Os artigos aparecem no site cerca de 1 minuto depois de publicados. Escreva de forma informativa, sem promessa de resultado.'
    folder: conteudo/artigos
    create: true
    delete: true
    extension: md
    format: frontmatter
    identifier_field: titulo
    slug: '{{titulo}}'
    summary: '{{titulo}} · {{data}}'
    sortable_fields: ['data', 'titulo']
    fields:
      - label: Título
        name: titulo
        widget: string
        hint: 'Claro e direto, como a pessoa pesquisaria no Google. Exemplo: "Auxílio-acidente: quem tem direito".'
      - label: Descrição curta
        name: descricao
        widget: text
        hint: 'Uma ou duas frases (até uns 160 caracteres). Aparece no Google e no cartão do artigo.'
      - label: Data de publicação
        name: data
        widget: datetime
        format: YYYY-MM-DD
        date_format: DD/MM/YYYY
        time_format: false
      - label: Calculadora relacionada
        name: calculadora
        widget: select
        hint: O artigo termina com um botão para essa calculadora.
        options:
          - { label: Tempo de contribuição, value: tempo-de-contribuicao }
          - { label: Simulador de aposentadoria, value: simulador-de-aposentadoria }
          - { label: Valor do benefício, value: valor-do-beneficio }
          - { label: BPC/LOAS, value: bpc-loas }
          - { label: Pensão por morte, value: pensao-por-morte }
          - { label: Auxílio-doença, value: auxilio-doenca }
      - label: Imagem de capa (opcional)
        name: imagem
        widget: image
        required: false
      - label: Texto do artigo
        name: body
        widget: markdown
        buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list, quote]
        editor_components: []
        hint: 'Use "Título 2" para os subtítulos. Valores que mudam todo ano: escreva {{salario_minimo}}, {{teto}}, {{bpc_limite}}, {{bpc_limite_meio}} ou {{ano}} e o site preenche sozinho.'
      - label: Nota no fim do artigo
        name: nota
        widget: string
        required: false
        default: Conteúdo informativo. A análise depende dos documentos e do histórico de cada pessoa.
      - label: Tempo de leitura (minutos)
        name: minutos
        widget: number
        required: false
        value_type: int
        hint: Deixe em branco para o site calcular sozinho.
      - label: Rascunho (não publicar ainda)
        name: rascunho
        widget: boolean
        required: false
        default: false
      - label: Ordem
        name: ordem
        widget: hidden
        required: false
