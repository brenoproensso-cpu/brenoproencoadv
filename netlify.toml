# Hospedagem principal: Cloudflare Pages (build: npm run build, saída: dist).
# O Netlify ficou só como redirecionamento do endereço antigo (pasta netlify-redirect).
# Ele só publica de novo se essa pasta mudar, para não gastar créditos.
[build]
  command = "echo redirecionamento"
  publish = "netlify-redirect"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- netlify-redirect/"
